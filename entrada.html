<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrada / Recepción 3D - FreeChair</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="script.js"></script>
</head>
<body>
    <div class="panel">
        <h2>Entrada / Recepción 3D</h2>
        
        <div class="tabs">
            <button onclick="cargar('restaurante.html', 'Restaurante')">Restaurante</button>
            <button onclick="cargar('lavabo.html', 'Baño')">Baño</button>
            <button onclick="cargar('almacen.html', 'Almacén')">Almacén</button>
            <button onclick="cargar('cocina.html', 'Cocina')">Cocina</button>
            <button class="active" onclick="cargar('entrada.html', 'Entrada')">Entrada</button>
        </div>

        <p>Con el mouse puedes girar la cámara y con WASD o las flechas puedes moverte.</p>
        <p>Apunta con el cursor al mostrador, plantas o pantalla de reservas para interactuar.</p>
        <p>Elementos de recepción interactuados: <span id="contador">0</span></p>
    </div>

    <a-scene>
        <a-assets>
            <img id="piso" src="img/piso.jpg">
            <img id="cielo" src="img/fondo.jpg">
        </a-assets>

        <!-- CAMARA CON CURSOR -->
        <a-entity position="0 1.6 8">
            <a-camera>
                <a-cursor color="#4caf50" fuse="true" fuse-timeout="700"></a-cursor>
            </a-camera>
        </a-entity>

        <a-sky src="#cielo"></a-sky>

        <a-light type="ambient" intensity="0.9"></a-light>
        <a-light type="point" intensity="1.5" position="0 8 0"></a-light>

        <!-- PARED TRASERA CON MARCO DE ENTRADA -->
        <a-box position="0 4 -12" width="30" height="8" depth="0.5" color="#1a252f"></a-box>

        <!-- CARTEL 3D BIENVENIDOS -->
        <a-text
            value="BIENVENIDOS A FREECHAIR"
            position="-7 6.2 -11.5"
            scale="2.6 2.6 2.6"
            color="#2ecc71">
        </a-text>

        <!-- ARCO DE ENTRADA PRINCIPAL -->
        <a-box position="-4 3 -11" width="0.8" height="6" depth="0.8" color="#34495e"></a-box>
        <a-box position="4 3 -11" width="0.8" height="6" depth="0.8" color="#34495e"></a-box>
        <a-box position="0 5.8 -11" width="8.8" height="0.8" depth="0.8" color="#34495e"></a-box>

        <!-- MOSTRADOR DE RECEPCIÓN / HOSTESS DESK -->
        <a-box position="0 1 -4" width="5" height="1.2" depth="1.5" color="#2c3e50">
            <!-- Pantalla de confirmación de reservas -->
            <a-box class="producto" position="0 0.8 0" width="0.8" height="0.5" depth="0.05" color="#111111"></a-box>
            <!-- Campana de recepción -->
            <a-sphere class="producto" position="1.5 0.7 0" radius="0.12" color="#f1c40f"></a-sphere>
        </a-box>

        <!-- TAPETE DE BIENVENIDA (ALFOMBRA ROJA/VERDE) -->
        <a-plane position="0 0.02 0" rotation="-90 0 0" width="3" height="10" color="#e74c3c"></a-plane>

        <!-- PLANTAS DECORATIVAS A LOS LADOS -->
        <!-- Maceta Izquierda -->
        <a-entity position="-3.5 0 -2">
            <a-cylinder class="producto" position="0 0.5 0" radius="0.4" height="1" color="#7f8c8d"></a-cylinder>
            <a-sphere class="producto" position="0 1.3 0" radius="0.7" color="#27ae60"></a-sphere>
        </a-entity>

        <!-- Maceta Derecha -->
        <a-entity position="3.5 0 -2">
            <a-cylinder class="producto" position="0 0.5 0" radius="0.4" height="1" color="#7f8c8d"></a-cylinder>
            <a-sphere class="producto" position="0 1.3 0" radius="0.7" color="#27ae60"></a-sphere>
        </a-entity>

        <!-- SOFÁ DE ESPERA (IZQUIERDA) -->
        <a-entity position="-5 0 2">
            <a-box position="0 0.4 0" width="2.2" height="0.4" depth="1" color="#da345d"></a-box>
            <a-box position="0 0.9 -0.45" width="2.2" height="0.8" depth="0.1" color="#da345d"></a-box>
        </a-entity>

        <!-- LÁMPARA ANIMADA ENTRADA -->
        <a-torus
            position="0 5.2 -4"
            radius="0.9"
            radius-tubular="0.05"
            color="#2ecc71"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
        </a-torus>

        <!-- PISO -->
        <a-plane
            rotation="-90 0 0"
            width="40"
            height="40"
            src="#piso"
            repeat="15 15"
            shadow="receive: true">
        </a-plane>
    </a-scene>

    <script src="script.js"></script>
    <script src="app.js"></script>
</body>
</html>
